plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.irudpchat'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.irudpchat'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        // the unit tests read the classifier model from the app's assets
        test.resources.srcDir 'src/main/assets'
    }
}

dependencies {
    // AndroidX brings Kotlin's standard library in two shapes (kotlin-stdlib 1.8 and the older
    // kotlin-stdlib-jdk7/jdk8 split); the BOM aligns their versions so no class is there twice
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.1'
    testImplementation 'junit:junit:4.13.2'
}
